--><h3 class="area_label">Settings</h3>
    <section id="settings">
        <input type="checkbox" id="toggle_marking"><label for="toggle_marking"><strong>Highlight exported questions</strong></label><br>
        <input type="checkbox" id="toggle_log"><label for="toggle_log"><strong>Enable pending export tracker</strong></label><br> 
    </section>
    <h3 class="area_label">Data</h3>
    <section id="data">
        <input type="button" class ="chill_btn" id="import_data" value="Import backup" style="background-color: skyblue;"><input type="file" width="40%" id="import_file" accept=".json,application/json" hidden>
        <input type="button" class ="chill_btn" id="export_data" value="Export backup" style="background-color: skyblue;">
        <input type="button" class ="risky_btn" id="reset_settings" value="Reset settings" style="background-color: rgb(73, 106, 119)"> <br>
        <input type="button" class ="risky_btn" id="clear_log" value="Clear exported history" data-state="initial" style="background-color: gray"> <br>
        <h4 style="font-size: x-small;color:gray">Backups include exported history and settings.</h4>
    </section>
    <script src="popup.js"></script>
